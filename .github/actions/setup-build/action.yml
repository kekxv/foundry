name: Set up Foundry build tools
description: Select the pinned Rust toolchain and the Windows MSVC linker
runs:
  using: composite
  steps:
    - name: Use an isolated Rust installation on Linux arm64
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        # The hosted image can contain a partially installed pinned toolchain.
        rustup_home=$(mktemp -d "$RUNNER_TEMP/foundry-rustup.XXXXXXXX")
        printf 'RUSTUP_HOME=%s\n' "$rustup_home" >> "$GITHUB_ENV"
    - name: Select the Visual Studio linker on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $linker = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\link.exe' |
          Select-Object -First 1
        if (-not $linker -or -not (Test-Path -LiteralPath $linker -PathType Leaf)) {
          throw 'Visual Studio x64 linker was not found'
        }
        $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
        $variables = & cmd.exe /d /c ('call "{0}" > nul && set' -f $vcvars)
        if ($LASTEXITCODE -ne 0) { throw 'Visual Studio x64 developer environment could not be loaded' }
        $variables | Where-Object { $_ -match '^(INCLUDE|LIB|LIBPATH)=' } |
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" -Encoding utf8
    - name: Install pinned Rust
      shell: bash
      run: |
        rustc --version
        cargo --version
