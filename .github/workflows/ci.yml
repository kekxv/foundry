name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style:
    name: Code style
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.18.0'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/test_site_registry.py
      - run: npm ci --prefix website
      - run: rustup show
      - run: python scripts/format_code.py --check
  rust:
    name: Client and distribution / ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15, platform: macos-arm64}
          - {runner: windows-2022, platform: windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/test_registry.py
      - run: python scripts/test_extension_diff.py
      - uses: ./.github/actions/setup-build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check Windows system OpenSSH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sshDir = Join-Path ([Environment]::SystemDirectory) 'OpenSSH'
          if (-not (Test-Path -LiteralPath (Join-Path $sshDir 'ssh-keygen.exe'))) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
          }
          & (Join-Path $sshDir 'ssh.exe') -V
          if ($LASTEXITCODE -ne 0) { throw 'Windows OpenSSH Client is unavailable' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $sshDir
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.18.0'}
      - name: Test signed client installer on Linux
        if: runner.os == 'Linux'
        run: python scripts/test_install.py
      - name: Test signed client installer on macOS
        if: runner.os == 'macOS'
        run: python scripts/test_install.py --openssl "$(brew --prefix openssl@3)/bin/openssl"
      - name: Test signed client installer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = @(
            "$env:ProgramFiles/Git/mingw64/bin/openssl.exe"
            "$env:ProgramFiles/Git/usr/bin/openssl.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $openssl) { throw 'OpenSSL 3 from Git for Windows was not found' }
          python scripts/test_install.py --openssl $openssl
      - name: Generate, package and run all extension templates
        run: python scripts/test_scaffold.py --platform "${{ matrix.platform }}"
      - run: python scripts/test_device_plugins.py
      - run: python scripts/test_distribution.py
      - run: python scripts/test_native_isolation.py
      - run: python scripts/test_host_files.py
      - run: python scripts/test_release_pipeline.py
      - name: PR candidate digests (unsigned preview only)
        if: github.event_name == 'pull_request'
        run: python scripts/build_extensions.py --out dist/pr-candidate --retain-external-for-scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: pr-candidate-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/pr-candidate/*.zip
            dist/pr-candidate/candidates.json
            dist/pr-candidate/external-scan/*.zip
          if-no-files-found: error
          retention-days: 7
  malware-scan:
    name: PR malware scan
    if: always() && github.event_name == 'pull_request'
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a successful candidate build
        env:
          BUILD_RESULT: ${{ needs.rust.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pr-candidate-*-${{ github.sha }}
          path: ${{ runner.temp }}/foundry-scan
      - uses: ./trusted/.github/actions/setup-clamav
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r trusted/requirements-ci.txt
      - name: Verify archive detection and scan failure handling
        run: |
          python trusted/scripts/test_malware_scan.py
          python trusted/scripts/test_malware_scan.py --with-clamav
      - name: Scan extension ZIPs with ClamAV
        env:
          SCAN_DIR: ${{ runner.temp }}/foundry-scan
        run: python trusted/scripts/malware_scan.py --artifacts "$SCAN_DIR" --commit "$GITHUB_SHA" --registry candidate
  website:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: '24.18.0',
            cache: npm,
            cache-dependency-path: website/package-lock.json,
          }
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - run: npm run build --prefix website
        env: {FOUNDRY_BASE: '/foundry/'}
