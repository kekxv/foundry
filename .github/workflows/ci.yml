name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  style:
    name: Code style
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.18.0'}
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix website
      - run: rustup show
      - run: python scripts/format_code.py --check
  rust:
    name: Client and distribution / ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15, platform: macos-arm64}
          - {runner: windows-2022, platform: windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/test_registry.py
      - run: python scripts/test_extension_diff.py
      - name: Install pinned Rust
        shell: bash
        run: rustup show && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Generate, package and run all extension templates
        run: python scripts/test_scaffold.py --platform "${{ matrix.platform }}"
      - run: python scripts/test_device_plugins.py
      - run: python scripts/test_distribution.py
      - run: python scripts/test_native_isolation.py
      - run: python scripts/test_host_files.py
      - run: python scripts/test_release_pipeline.py
      - name: PR candidate digests (unsigned preview only)
        run: python scripts/build_extensions.py --out dist/pr-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-candidate-${{ matrix.platform }}-${{ github.sha }}
          path: dist/pr-candidate/*
          if-no-files-found: error
  website:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: '24.18.0',
            cache: npm,
            cache-dependency-path: website/package-lock.json,
          }
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - run: npm run build --prefix website
        env: {FOUNDRY_BASE: '/foundry/'}
