name: Extension presubmit

on:
  # Always start on PRs so the stable required gate also completes for docs-only changes.
  pull_request:
  push:
    branches: [main]
    paths:
      [
        'extensions/**',
        'scripts/**',
        'crates/**',
        'tools/**',
        'schemas/**',
        'Cargo.*',
        'rust-toolchain.toml',
        'requirements-ci.txt',
        '.gitattributes',
        '.github/workflows/**',
      ]
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension ID; empty tests all versions'
        required: false
        type: string
      version:
        description: 'Exact version (requires extension); empty tests every version'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: extension-presubmit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Extension review diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: candidate, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r trusted/requirements-ci.txt
      - name: Compare extension versions with trusted base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python trusted/scripts/extension_diff.py --root "$GITHUB_WORKSPACE/candidate" --base "$BASE_SHA" \
            --output "$RUNNER_TEMP/foundry-diff/report.md" \
            --json-output "$RUNNER_TEMP/foundry-diff/report.json"
          cat "$RUNNER_TEMP/foundry-diff/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extension-review-diff-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/foundry-diff/
          if-no-files-found: warn
          retention-days: 14

  matrix:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.extensions.outputs.matrix }}
      has_changes: ${{ steps.extensions.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      # Parse PR data using code/dependencies from the trusted base, without executing PR Python.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r trusted/requirements-ci.txt
      - id: extensions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_EXTENSION: ${{ inputs.extension }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          args=(--root "$GITHUB_WORKSPACE/candidate")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          if [ -n "$INPUT_EXTENSION" ]; then args+=(--extension "$INPUT_EXTENSION"); fi
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "$INPUT_VERSION"); fi
          python trusted/scripts/extension_matrix.py "${args[@]}"

  test:
    name: ${{ matrix.extension }}@${{ matrix.version }} / ${{ matrix.platform }}
    timeout-minutes: 30
    needs: matrix
    if: needs.matrix.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - name: Install pinned Rust
        shell: bash
        run: rustup show && rustup component add rustfmt clippy
      - run: cargo build --release --workspace --locked
        env:
          FOUNDRY_PROFILE: release
      - name: Run this extension's presubmit
        id: presubmit
        shell: bash
        env:
          FOUNDRY_PROFILE: release
          EXTENSION_ID: ${{ matrix.extension }}
          EXTENSION_VERSION: ${{ matrix.version }}
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/test_extension.py --extension "$EXTENSION_ID" --version "$EXTENSION_VERSION" --platform "$TEST_PLATFORM" 2>&1 | tee "$RUNNER_TEMP/extension-test.log"
      - name: Platform result summary
        if: always()
        shell: bash
        env:
          EXTENSION_ID: ${{ matrix.extension }}
          EXTENSION_VERSION: ${{ matrix.version }}
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_RESULT: ${{ steps.presubmit.outcome }}
        run: |
          {
            echo "### $EXTENSION_ID@$EXTENSION_VERSION / $TEST_PLATFORM"
            echo "Presubmit result: ${TEST_RESULT:-not run (setup/build failed)}"
            echo "See the job log and extension-test artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: extension-test-${{ matrix.extension }}-${{ matrix.version }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/extension-test.log
          if-no-files-found: warn
          retention-days: 14

  checks:
    name: Extension checks
    needs: [diff, matrix, test]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Aggregate diff and platform checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_RESULT: ${{ needs.diff.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HAS_CHANGES: ${{ needs.matrix.outputs.has_changes }}
        run: |
          {
            echo "## Extension checks"
            echo "Review diff: $DIFF_RESULT"
            echo "Version/platform planning: $MATRIX_RESULT"
            echo "Platform tests: $TEST_RESULT"
            echo "Declared targets: Linux x64/arm64, macOS arm64, Windows x64."
            echo "Each affected version runs the platforms declared in its presubmit.yml."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$MATRIX_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then test "$DIFF_RESULT" = success; fi
          if [ "$HAS_CHANGES" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$HAS_CHANGES" = false
            test "$TEST_RESULT" = skipped
          fi
