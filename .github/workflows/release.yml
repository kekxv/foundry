name: Signed release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable release version, e.g. 0.1.0 (must match Cargo.toml)'
        required: true
      sequence:
        description: 'Monotonic signed index sequence (must exceed previous release)'
        required: true
permissions:
  contents: read
concurrency:
  group: foundry-production-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      sequence: ${{ steps.check.outputs.sequence }}
      commit: ${{ github.sha }}
      history_sha256: ${{ steps.check.outputs.history_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - id: check
        env:
          VERSION: ${{ inputs.version }}
          SEQUENCE: ${{ inputs.sequence }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/validate_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: verified-history,
            path: dist/history/,
            if-no-files-found: error,
          }
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: macos-15, platform: macos-arm64}
          - {runner: windows-2022, platform: windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          {
            ref: '${{ needs.validate.outputs.commit }}',
            persist-credentials: false,
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/test_registry.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verified-history, path: dist/history}
      - run: rustup show
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: python scripts/test_device_plugins.py
        env: {FOUNDRY_PROFILE: release}
      - run: python scripts/test_distribution.py
        env: {FOUNDRY_PROFILE: release}
      - run: python scripts/test_native_isolation.py
        env: {FOUNDRY_PROFILE: release}
      - name: Check file host and approval binding
        run: python scripts/test_host_files.py && python scripts/test_release_pipeline.py
        env: {FOUNDRY_PROFILE: release}
      - name: Stage client and extensions
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PREVIOUS_INDEX: dist/history/index.json
          EXPECTED_PREVIOUS_SHA256: ${{ needs.validate.outputs.history_sha256 }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/stage_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  candidate:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verified-history, path: dist/history}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: release-*, path: candidate}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - id: digest
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          PREVIOUS_INDEX: dist/history/index.json
          EXPECTED_PREVIOUS_SHA256: ${{ needs.validate.outputs.history_sha256 }}
          SEQUENCE: ${{ needs.validate.outputs.sequence }}
        run: python scripts/assemble_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {
            name: approved-candidate,
            path: dist/approved/,
            if-no-files-found: error,
          }
  sign:
    needs: [validate, candidate]
    runs-on: ubuntu-22.04
    # Configure required reviewers and default-branch-only deployment rules in GitHub Settings.
    environment:
      name: release-signing
      url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: verified-history, path: dist/history}
      - run: rustup show && cargo build --release --locked -p foundry-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: approved-candidate, path: dist/approved}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify immutable candidate data
        env:
          PREVIOUS_INDEX: dist/history/index.json
          EXPECTED_PREVIOUS_SHA256: ${{ needs.validate.outputs.history_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          SEQUENCE: ${{ needs.validate.outputs.sequence }}
        run: python scripts/verify_candidate.py
      - name: Sign data only (never run candidate binaries)
        env:
          FOUNDRY_SIGNING_KEY: ${{ secrets.FOUNDRY_SIGNING_KEY }}
          FOUNDRY_KEY_ID: ${{ vars.FOUNDRY_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FOUNDRY_KEY_ID"
          target/release/foundry-release sign --input dist/approved/index.json --output dist/approved/index.json.sig --key-id "$FOUNDRY_KEY_ID"
          target/release/foundry-release verify --input dist/approved/index.json --signature dist/approved/index.json.sig --root trust/root.json
          target/release/foundry-release sign --input dist/approved/release-manifest.json --output dist/approved/release-manifest.json.sig --key-id "$FOUNDRY_KEY_ID" --domain release
          target/release/foundry-release sign-installer --input dist/approved/release-manifest.json --manifest dist/approved/install-manifest.txt --output dist/approved/install-manifest.txt.sig --root trust/root.json --allowed-signers dist/approved/allowed_signers
          ssh-keygen -Y verify -I foundry-release -n foundry-install-v1 -f dist/approved/allowed_signers -s dist/approved/install-manifest.txt.sig < dist/approved/install-manifest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          {name: signed-release, path: dist/approved/, if-no-files-found: error}
  publish:
    needs: [validate, sign]
    runs-on: ubuntu-22.04
    environment: release-publishing
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: signed-release, path: dist/release}
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Version already published" >&2; exit 1; fi
          gh release create "v$VERSION" dist/release/* --target "$COMMIT" --title "Foundry $VERSION" --notes "Signed extensions and cross-platform clients. Verify against the trusted public root."
  pages:
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions: {contents: write}
