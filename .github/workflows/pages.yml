name: Website and signed registry
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      signed-registry:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: '24.18.0',
            cache: npm,
            cache-dependency-path: website/package-lock.json,
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ci.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.signed-registry
        with: {name: signed-release, path: dist/signed}
      - name: Generate the Pages registry
        env:
          SIGNED_REGISTRY: ${{ inputs.signed-registry }}
        shell: bash
        run: |
          args=()
          if [[ "$SIGNED_REGISTRY" == true ]]; then
            args+=(--signed dist/signed --repository "$GITHUB_REPOSITORY")
          fi
          python scripts/pages_registry.py "${args[@]}"
      - run: npm ci --prefix website
      - run: npm run check --prefix website
      - name: Build project Pages site
        env:
          FOUNDRY_REPOSITORY: ${{ github.repository }}
          FOUNDRY_OWNER: ${{ github.repository_owner }}
        run: python scripts/build_site.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: website, path: website/dist/, if-no-files-found: error}
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: website, path: public}
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
