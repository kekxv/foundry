name: ClamAV database cache
on:
  schedule:
    - cron: '23 0 * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: clamav-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  warm:
    name: Warm ClamAV cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup-clamav
