[package]
name = "foundry-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "foundry"
path = "src/main.rs"
[[test]]
name = "cli_e2e"
path = "../../tests/e2e/cli_e2e.rs"
[dependencies]
foundry-core.workspace = true
foundry-store.workspace = true
foundry-runtime.workspace = true
foundry-worker = { path = "../foundry-worker" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
semver = "1"
tempfile = "3"
[dev-dependencies]
ed25519-dalek = "2"
hex.workspace = true
